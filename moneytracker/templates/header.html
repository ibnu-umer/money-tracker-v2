{% load static %}
<header class="header">
    <div class="header-logo">Money Tracker</div>

    <div class="header-calendar">
        <select id="yearDropdown" class="calendar-dropdown">
        </select>
        <select id="monthDropdown" class="calendar-dropdown">
            <option>January</option>
            <option>February</option>
            <option>March</option>
            <option>April</option>
            <option>May</option>
            <option>June</option>
            <option>July</option>
            <option>August</option>
            <option>September</option>
            <option>October</option>
            <option>November</option>
            <option>December</option>
        </select>
    </div>

    <div class="nav-bar">
        <div class="nav-options">
            <a href="{% url 'transactions' %}" class="nav-item">
                <img src="{%static 'icons/filter-icon.png' %}" alt="Filter transactions" class="nav-icon"/>Filter
            </a>
            <a href="{% url 'categories' %}" class="nav-item">
                <img src="{%static 'icons/hub-icon.png' %}" alt="Budget & Savings" class="nav-icon"/>Hub
            </a>
            <a href="{% url 'dashboard' %}" class="nav-item">
                <img src="{%static 'icons/home-icon.png' %}" alt="Home Page" class="nav-icon"/>Home
            </a>
        </div>
        <div class="profile-settings">
            <button class="profile-avatar" id="profileButton" data-modal-open="profileModal"></button>

            <div class="profile-modal hidden" id="profileModal" data-modal-type="dropdown" data-align="right">
                <div class="profile-navigation">
                    <button type="button" class="profile-button">Edit Profile</button>
                    <button type="button" class="profile-button">Account Settings</button>
                    <button type="button" class="profile-button">Logout</button>
                </div>
            </div>
        </div>
    </div>
</header>
<script src="{% static 'js/header.js' %}"></script>
