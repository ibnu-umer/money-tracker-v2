{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- ----------------STYLES----------------- -->
        <link rel="stylesheet" href="{% static 'css/global.css' %}">
        <link rel="stylesheet" href="{% static 'css/header.css' %}">
        <link rel="stylesheet" href="{% static 'css/modal.css' %}">
        <link rel="stylesheet" href="{% static 'css/categories.css' %}">

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Money Tracker Dashboard</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="main-container">
        <!-- Header -->
        {% include "header.html" %}

        <div class="categories-sections">
            <!-- Income Categories -->
            <section class="category-section">
                <div class="heading-section">
                    <div class="heading">
                        <div class="name">Income Categories</div>
                        <div class="btn">+</div>
                    </div>
                    <hr>
                </div>
                <div class="categories" id="incomeCategories">
                    <div class="card">
                        <span>Food</span>
                        <div class="card-actions">
                            <button class="btn" onclick="openEditModal('Food', 'Expense')">✏️</button>
                            <button class="btn" onclick="deleteCategory(this)">🗑️</button>
                        </div>
                    </div>

                    <div class="card">
                        <span>Salary</span>
                        <div class="card-actions">
                            <button class="btn" onclick="openEditModal('Salary', 'Income')">✏️</button>
                            <button class="btn" onclick="deleteCategory(this)">🗑️</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Expense Categories -->
            <section class="category-section">
                <div class="heading-section">
                    <div class="heading">
                        <div class="name">Income Categories</div>
                        <div class="btn">+</div>
                    </div>
                    <hr>
                </div>
                <div class="categories" id="expenseCategories">
                    <div class="card">
                        <span>Food</span>
                        <div class="card-actions">
                            <button class="btn" onclick="openEditModal('Food', 'Expense')">✏️</button>
                            <button class="btn" onclick="deleteCategory(this)">🗑️</button>
                        </div>
                    </div>

                    <div class="card">
                        <span>Salary</span>
                        <div class="card-actions">
                            <button class="btn" onclick="openEditModal('Salary', 'Income')">✏️</button>
                            <button class="btn" onclick="deleteCategory(this)">🗑️</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
