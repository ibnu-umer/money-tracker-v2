{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- ----------------STYLES----------------- -->
        <link rel="stylesheet" href="{% static 'css/global.css' %}">
        <link rel="stylesheet" href="{% static 'css/header.css' %}">
        <link rel="stylesheet" href="{% static 'css/modal.css' %}">
        <link rel="stylesheet" href="{% static 'css/categories.css' %}">

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Money Tracker Dashboard</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="main-container">
            <!-- Header -->
            {% include "header.html" %}

            <div class="categories-sections">
                <!-- Income Categories -->
                <section class="category-section">
                    <div class="heading-section">
                        <div class="heading">
                            <div class="name">Income Categories</div>
                            <div class="btn" data-modal-open="categoryModal" data-id="new">+</div>
                        </div>
                        <hr>
                    </div>
                    <div class="categories" id="incomeCategories">
                        <div class="card">
                            <div class="info">
                                <div class="icon">🥗</div>
                                <div class="cat-name">Food</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn" data-modal-open="categoryModal" data-id="100">✏️</button>
                                <button class="btn">🗑️</button>
                            </div>
                        </div>

                        <div class="card">
                            <div class="info">
                                <div class="icon">🥗</div>
                                <div class="cat-name">Food</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn" data-modal-open="categoryModal" data-id="101">✏️</button>
                                <button class="btn">🗑️</button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Expense Categories -->
                <section class="category-section">
                    <div class="heading-section">
                        <div class="heading">
                            <div class="name">Expense Categories</div>
                            <div class="btn" data-modal-open="categoryModal" data-id="new">+</div>
                        </div>
                        <hr>
                    </div>
                    <div class="categories" id="expenseCategories">
                        <div class="card">
                            <div class="info">
                                <div class="icon">🌿</div>
                                <div class="cat-name">Food</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn" data-modal-open="categoryModal" data-id="102">✏️</button>
                                <button class="btn">🗑️</button>
                            </div>
                        </div>

                        <div class="card">
                            <div class="info">
                                <div class="icon">🥗</div>
                                <div class="cat-name">Food</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn" data-modal-open="categoryModal" data-id="103">✏️</button>
                                <button class="btn">🗑️</button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Modal -->
                <div class="modal-container hidden" id="categoryModal">
                    <div class="modal-overlay" data-modal-overlay>
                        <div class="modal-content">
                            <div class="modal-header">
                                <div class="form-title" id="form-title">Add Category</div>
                                <span class="data-modal-close" data-modal-close>&times;</span>
                            </div>

                            <div class="form-group">
                                <div class="cat-group">
                                    <button type="button" id="iconSelector" class="icon-selector">😀</button>
                                    <input type="text" id="newCategoryName" placeholder="Category name">
                                </div>
                            </div>

                            <select id="newCategoryType">
                                <option value="Income">Income</option>
                                <option value="Expense">Expense</option>
                            </select>

                            <button class="save-btn">Save</button>
                            <button class="cancel-btn" data-modal-close>Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script type="module">import "https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js";</script>
        <script src="{% static 'js/modal.js' %}" defer></script>
        <script src="{% static 'js/categories.js' %}"></script>
        </script>
    </body>
</html>
